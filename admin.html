<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a90018"><title>Ward 42 Admin Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="admin.js"></script></head>
<body class="admin-body"><header class="topbar"><a class="brand" href="index.html"><span class="seal">42</span><span><b>Ward 42 Admin</b><small>குறை நிர்வாக Dashboard</small></span></a><button id="logoutBtn" class="btn secondary" hidden>வெளியேறு</button></header>
<main class="admin-main">
<section id="loginPanel" class="admin-panel"><span class="eyebrow">பாதுகாப்பான நிர்வாக உள்நுழைவு</span><h1>Admin Login</h1><form id="loginForm"><label>Email<input required type="email" name="email" placeholder="admin@email.com"></label><label>Password<span class="password-wrap"><input required type="password" name="password"><button class="password-eye" type="button" aria-label="Password-ஐ காட்டவும்" title="Password-ஐ காட்டவும்">👁️</button></span></label><button class="submit" type="submit">உள்நுழைக</button><button class="reset-link" id="resetBtn" type="button">Password மறந்துவிட்டதா?</button><p id="loginMessage" aria-live="polite"></p></form></section>
<section id="passwordPanel" class="admin-panel" hidden><span class="eyebrow">புதிய Admin Password</span><h1>Password அமைக்கவும்</h1><form id="passwordForm"><label>புதிய Password<span class="password-wrap"><input required minlength="8" type="password" name="password" placeholder="குறைந்தது 8 எழுத்துகள்"><button class="password-eye" type="button" aria-label="Password-ஐ காட்டவும்">👁️</button></span></label><label>மீண்டும் Password<span class="password-wrap"><input required minlength="8" type="password" name="confirm" placeholder="Password மீண்டும் உள்ளிடவும்"><button class="password-eye" type="button" aria-label="Password-ஐ காட்டவும்">👁️</button></span></label><button class="submit" type="submit">Password சேமிக்கவும்</button><p id="passwordMessage" aria-live="polite"></p></form></section>
<section id="dashboard" hidden><div class="dashboard-head"><div><span class="eyebrow">Live Dashboard</span><h1>மக்கள் குறைகள்</h1></div><button id="refreshBtn" class="btn secondary">↻ புதுப்பிக்க</button></div><div class="dashboard-stats"><article><b id="totalCount">0</b><span>மொத்தம்</span></article><article><b id="newCount">0</b><span>புதியவை</span></article><article><b id="progressCount">0</b><span>நடவடிக்கையில்</span></article><article><b id="resolvedCount">0</b><span>தீர்வு</span></article></div><div class="filters"><input id="searchInput" placeholder="குறை எண், பெயர், தெரு தேடுக"><select id="statusFilter"><option value="">அனைத்து நிலைகள்</option><option>புதியது</option><option>ஆய்வில்</option><option>நடவடிக்கையில்</option><option>தீர்க்கப்பட்டது</option><option>நிராகரிக்கப்பட்டது</option></select></div><div id="complaintList" class="complaint-list"></div></section>
</main></body></html>
